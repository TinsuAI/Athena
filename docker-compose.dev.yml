# Development Docker Compose Configuration
# Full stack with hot reloading for frontend and backend

version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: athena-postgres
    environment:
      POSTGRES_USER: athena
      POSTGRES_PASSWORD: athena
      POSTGRES_DB: athena
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "8981:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U athena -d athena" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: athena-redis
    ports:
      - "8982:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    container_name: athena-api
    environment:
      DATABASE_URL: postgresql+asyncpg://athena:athena@postgres:5432/athena
      REDIS_URL: redis://redis:6379
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-dev-secret-change-in-production}
    volumes:
      - ./api:/app
      - /app/.venv # Exclude venv from mount
    ports:
      - "8980:8980"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8980 --reload

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    container_name: athena-web
    environment:
      NEXTAUTH_URL: http://tinxudev.airplane-manta.ts.net:8979
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-dev-secret-change-in-production}
      NEXT_PUBLIC_API_URL: http://tinxudev.airplane-manta.ts.net:8980
    volumes:
      - ./web:/app
      - /app/node_modules # Exclude node_modules from mount
      - /app/.next # Exclude .next from mount
    ports:
      - "8979:3000"
    depends_on:
      - api
    command: npm run dev

volumes:
  postgres_data:
  redis_data:
