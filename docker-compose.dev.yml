# Development Docker Compose Configuration
# Full stack with hot reloading for frontend and backend

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: athena-postgres
    environment:
      POSTGRES_USER: athena
      POSTGRES_PASSWORD: athena
      POSTGRES_DB: athena
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    ports:
      - "8981:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U athena -d athena" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: athena-redis
    ports:
      - "8982:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    container_name: athena-api
    environment:
      DATABASE_URL: postgresql+asyncpg://athena:athena@postgres:5432/athena
      REDIS_URL: redis://redis:6379
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-dev-secret-change-in-production}
      NOTEBOOKLM_NOTEBOOK_ID: ${NOTEBOOKLM_NOTEBOOK_ID:-}
    volumes:
      - ./api:/app
      - ./docs:/docs:ro # Mount docs for tariff data import
      - ~/.config/notebooklm-mcp:/root/.config/notebooklm-mcp:ro # NotebookLM cookies (primary path)
      # Note: If auth fails, SDK might use ~/.notebooklm-mcp-cli/ instead. Check with `nlm --help` to verify cookie location.
      - /app/.venv # Exclude venv from mount
    ports:
      - "8980:8980"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8980 --reload

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    container_name: athena-web
    environment:
      NEXTAUTH_URL: https://athena.tinsu.ai
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-dev-secret-change-in-production}
      NEXT_PUBLIC_API_URL: https://athena-api.tinsu.ai
    volumes:
      - ./web:/app
      - /app/node_modules # Exclude node_modules from mount
      - /app/.next # Exclude .next from mount
    ports:
      - "8979:3000"
    depends_on:
      - api
    command: npm run dev

volumes:
  postgres_data:
  redis_data:
