# Development Docker Compose Configuration
# Full stack with hot reloading for frontend and backend

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: athena-postgres
    environment:
      POSTGRES_USER: athena
      POSTGRES_PASSWORD: athena
      POSTGRES_DB: athena
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    ports:
      - "8981:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U athena -d athena" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: athena-redis
    ports:
      - "8982:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: athena-mailpit
    ports:
      - "8025:8025"   # Web UI
      - "1025:1025"   # SMTP
    restart: unless-stopped

  api:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    container_name: athena-api
    environment:
      DATABASE_URL: postgresql+asyncpg://athena:athena@postgres:5432/athena
      REDIS_URL: redis://redis:6379
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-dev-secret-change-in-production}
      NEXTAUTH_URL: https://athena.tinsu.ai
      NOTEBOOKLM_NOTEBOOK_ID: ${NOTEBOOKLM_NOTEBOOK_ID:-5d982e32-e9a6-43a2-a469-090dd46c140c}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_FROM_EMAIL: noreply@athena.local
      FRONTEND_URL: http://localhost:8979
    volumes:
      - ./api:/app
      - ./docs:/docs:ro # Mount docs for tariff data import
      - ~/.notebooklm:/root/.notebooklm:ro # NotebookLM Python SDK auth (notebooklm-py)
      - /app/.venv # Exclude venv from mount
    ports:
      - "8980:8980"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8980 --reload

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    container_name: athena-web
    environment:
      NEXTAUTH_URL: https://athena.tinsu.ai
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-dev-secret-change-in-production}
      NEXT_PUBLIC_API_URL: ""
      API_BACKEND_URL: http://api:8980
    volumes:
      - ./web:/app
      - /app/node_modules # Exclude node_modules from mount
      - /app/.next # Exclude .next from mount
    ports:
      - "8979:3000"
    depends_on:
      - api
    command: npm run dev

volumes:
  postgres_data:
  redis_data:
